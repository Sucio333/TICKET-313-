<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ticket 313">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="manifest" href="/static/manifest.json">
    <title>Crear Cuenta - Ticket 313</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Reset y estilos generales */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Contenedor del formulario */
        .contenedor {
            background-color: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(10px);
            padding: 48px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
            width: 100%;
        }

        /* Título */
        h1 {
            font-size: 32px;
            font-weight: 700;
            color: white;
            margin-bottom: 24px;
            text-align: center;
            font-family: 'Sora', sans-serif;
        }

        /* Formulario */
        .formulario {
            display: flex;
            flex-direction: column;
        }

        /* Grupo del formulario */
        .grupo-formulario {
            margin-bottom: 20px;
        }

        /* Etiqueta */
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Input y Select */
        input,
        select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            background-color: rgba(255, 255, 255, 0.05);
            color: white;
            transition: all 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.3);
            background-color: rgba(255, 255, 255, 0.08);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* Estilos del select */
        select option {
            background-color: #1a1a1a;
            color: white;
        }

        /* Botón submit */
        .boton-submit {
            padding: 12px;
            background-color: white;
            color: #0a0a0a;
            border: 1px solid white;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 24px;
        }

        .boton-submit:hover {
            background-color: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
        }

        /* Enlace a login */
        .enlace-login {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .enlace-login a {
            color: white;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
        }

        .enlace-login a:hover {
            border-bottom-color: white;
        }

        /* Mensaje de error */
        .mensaje-error {
            background-color: rgba(220, 38, 38, 0.1);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 20px;
            border-left: 4px solid #dc2626;
            font-size: 14px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <!-- Contenedor del formulario -->
    <div class="contenedor">
        <!-- Título -->
        <h1>Crear Cuenta</h1>

        <!-- Mensaje de error si lo hay -->
        {% if error %}
        <div class="mensaje-error">
            {{ error }}
        </div>
        {% endif %}

        <!-- Formulario de registro -->
        <form method="POST" class="formulario">
            <!-- Campo de nombre -->
            <div class="grupo-formulario">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Juan Pérez">
            </div>

            <!-- Campo de email -->
            <div class="grupo-formulario">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required placeholder="tu@ejemplo.com">
            </div>

            <!-- Campo de contraseña -->
            <div class="grupo-formulario">
                <label for="contraseña">Contraseña</label>
                <input type="password" id="contraseña" name="contraseña" required placeholder="Crea una contraseña segura" minlength="6">
            </div>

            <!-- Campo de rol -->
            <div class="grupo-formulario">
                <label for="rol">Tipo de Cuenta</label>
                <select id="rol" name="rol" required>
                    <option value="asistente">Asistente (Comprador de Tickets)</option>
                    <option value="productor">Productor (Creador de Eventos)</option>
                </select>
            </div>

            <!-- Botón de registro -->
            <button type="submit" class="boton-submit">Crear Cuenta</button>
        </form>

        <!-- Enlace a login -->
        <div class="enlace-login">
            ¿Ya tienes cuenta? <a href="/login">Inicia sesión aquí</a>
        </div>
    </div>
</body>
</html>
